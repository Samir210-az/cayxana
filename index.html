<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#241608">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Çayxana">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<title>Çayxana · İdarəetmə</title>
<style>
:root{
  --bg:        #1a1108;
  --bg2:       #241608;
  --surface:   rgba(255,255,255,0.045);
  --surface2:  rgba(255,255,255,0.08);
  --border:    rgba(214,158,90,0.18);
  --border2:   rgba(214,158,90,0.35);

  --amber-100: #f7e4c2;
  --amber-300: #e0b16b;
  --amber-400: #d69e5a;
  --amber-500: #c2853c;
  --amber-glow: rgba(214,158,90,0.22);

  --red:       #e5484d;
  --red-bg:    rgba(229,72,77,0.14);
  --red-bd:    rgba(229,72,77,0.4);
  --green:     #4cc38a;
  --green-bg:  rgba(76,195,138,0.12);
  --green-bd:  rgba(76,195,138,0.35);

  --expense:   #e0794f;

  --text:      #f2e6d3;
  --text-dim:  #b8a688;

  --r-sm:10px; --r-md:14px; --r-lg:20px;
  --shadow:0 8px 28px rgba(0,0,0,0.45);
  --ease:cubic-bezier(0.16,1,0.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100dvh}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(ellipse at top,var(--bg2),var(--bg));
  color:var(--text);
  min-height:100dvh;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}

/* ---------- LOCK ---------- */
#lock{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  background-image:
    linear-gradient(180deg, rgba(13,7,3,0.45), rgba(13,7,3,0.82)),
    url('assets/samovar.png');
  background-size:cover;
  background-position:center;
}
.lock-card{
  width:100%;max-width:240px;
  background:rgba(20,12,4,0.55);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border2);
  border-radius:var(--r-md);
  padding:22px 18px 18px;
  text-align:center;
  box-shadow:0 16px 48px rgba(0,0,0,0.55);
}
#lock h1{font-size:15px;font-weight:700;color:var(--amber-100);margin-bottom:14px}
#lockForm{display:flex;flex-direction:column;align-items:center;gap:10px}
#pinInput{
  width:140px;text-align:center;font-size:19px;letter-spacing:6px;
  background:var(--surface);border:1.5px solid var(--border);color:var(--text);
  border-radius:var(--r-sm);padding:10px 8px;outline:none;
}
#pinInput:focus{border-color:var(--border2)}
#lockForm button{
  background:linear-gradient(145deg,var(--amber-400),var(--amber-500));
  color:#241608;font-weight:700;padding:9px 22px;font-size:13.5px;border-radius:var(--r-sm);
  box-shadow:var(--shadow);
}
#lockMsg{color:var(--red);font-size:13px;min-height:16px}

/* ---------- SHELL ---------- */
#app{display:none;max-width:720px;margin:0 auto;padding:0 16px 40px}
header.top{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(180deg,var(--bg2) 70%,transparent);
  padding:18px 0 12px;
}
.top-row{display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand .cup{font-size:26px}
.brand h1{font-size:18px;font-weight:800;color:var(--amber-100)}
.nav-btns{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.nav-btn{
  flex:0 0 auto;white-space:nowrap;
  padding:7px 12px;border-radius:var(--r-sm);
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-dim);font-size:12.5px;font-weight:600;
  transition:background .15s var(--ease),color .15s var(--ease);
}
.nav-btn.active{background:var(--amber-400);color:#241608;border-color:transparent}

.sales-banner{
  margin-top:12px;padding:16px 18px;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.sales-banner .lbl{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em}
.sales-banner .val{font-size:26px;font-weight:800;color:var(--amber-300)}

/* ---------- VIEWS ---------- */
.view{display:none;animation:fade-in .25s var(--ease)}
.view.active{display:block}
@keyframes fade-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Table grid */
.tables-grid{
  margin-top:18px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;
}
.table-card{
  aspect-ratio:1/0.95;border-radius:var(--r-lg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  border:1.5px solid var(--green-bd);background:var(--green-bg);
  transition:transform .12s var(--ease);
}
.table-card:active{transform:scale(0.96)}
.table-card.dolu{border-color:var(--red-bd);background:var(--red-bg)}
.table-card .no{font-size:22px;font-weight:800}
.table-card .st{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.table-card.boş .st{color:var(--green)}
.table-card.dolu .st{color:var(--red)}
.table-card .amt{font-size:13px;color:var(--text-dim);font-weight:600}

.add-table-btn{
  aspect-ratio:1/0.95;border-radius:var(--r-lg);
  border:1.5px dashed var(--border);color:var(--text-dim);
  display:flex;align-items:center;justify-content:center;font-size:26px;
}

.section-actions{display:flex;gap:10px;margin-top:20px}
.ghost-btn{
  flex:1;padding:11px;border-radius:var(--r-sm);
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-dim);font-size:13px;font-weight:600;text-align:center;
}

/* Masa (order) view */
.masa-head{display:flex;align-items:center;gap:12px;margin-top:16px}
.back-btn{
  width:38px;height:38px;border-radius:50%;background:var(--surface);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;
}
.masa-head h2{font-size:19px;font-weight:800}

.products-grid{
  margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;
}
.product-btn{
  padding:14px 8px;border-radius:var(--r-md);background:var(--surface);
  border:1px solid var(--border);text-align:center;width:100%;
}
.product-btn .pn{font-size:13px;font-weight:700;display:block}
.product-btn .pp{font-size:12px;color:var(--amber-300);display:block;margin-top:3px}
.product-btn:active{background:var(--surface2)}
.add-product-tile{border-style:dashed;color:var(--text-dim)}

.order-list{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.order-line{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--border);
}
.order-line .nm{font-size:14px;font-weight:600;flex:1}
.order-line .sub{font-size:11px;color:var(--text-dim)}
.qty-ctrl{display:flex;align-items:center;gap:8px}
.qty-ctrl button{
  width:26px;height:26px;border-radius:50%;background:var(--surface2);
  border:1px solid var(--border);font-size:14px;font-weight:700;line-height:1;
}
.qty-ctrl span{min-width:16px;text-align:center;font-weight:700;font-size:14px}
.line-total{min-width:56px;text-align:right;font-weight:700;font-size:14px}
.empty-note{color:var(--text-dim);font-size:13px;text-align:center;padding:24px 0}

.masa-total{
  margin-top:18px;padding:16px;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:space-between;
}
.masa-total .lbl{font-size:13px;color:var(--text-dim)}
.masa-total .val{font-size:24px;font-weight:800;color:var(--amber-300)}

.pay-btn{
  width:100%;margin-top:14px;padding:15px;border-radius:var(--r-lg);
  background:linear-gradient(145deg,var(--green),#3aa876);color:#0d1f16;
  font-weight:800;font-size:15px;box-shadow:0 8px 20px rgba(76,195,138,0.25);
}
.pay-btn:disabled{opacity:.4;box-shadow:none}

/* Hesabat view */
.period-tabs{display:flex;gap:8px;margin-top:16px}
.period-tabs button{
  flex:1;padding:10px;border-radius:var(--r-sm);background:var(--surface);
  border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text-dim);
}
.period-tabs button.active{background:var(--amber-400);color:#241608;border-color:transparent}

.summary-row{margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-card{
  padding:14px 8px;border-radius:var(--r-lg);text-align:center;
  background:var(--surface);border:1px solid var(--border2);
}
.stat-card .val{font-size:19px;font-weight:800}
.stat-card .lbl{font-size:11px;color:var(--text-dim);margin-top:4px}
.stat-card.income .val{color:var(--amber-300)}
.stat-card.expense .val{color:var(--expense)}
.stat-card.net .val{color:var(--green)}
.stat-card.net.negative .val{color:var(--red)}

/* Xərclər */
.expense-banner{
  margin-top:12px;padding:16px 18px;border-radius:var(--r-lg);
  background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.expense-banner .lbl{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em}
.expense-banner .val{font-size:26px;font-weight:800;color:var(--expense)}
.expense-list{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.expense-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--border);
}
.expense-row .nm{font-size:14px;font-weight:600}
.expense-row .dt{font-size:11px;color:var(--text-dim);margin-top:2px}
.expense-row .amt{font-size:14px;font-weight:700;color:var(--expense)}
.expense-row .del{
  width:26px;height:26px;border-radius:50%;background:var(--surface2);
  border:1px solid var(--border);font-size:14px;color:var(--text-dim);flex-shrink:0;
}

.report-grid{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.report-card{
  padding:14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--border);
}
.report-card .no{font-size:15px;font-weight:700}
.report-card .amt{font-size:18px;font-weight:800;color:var(--amber-300);margin-top:6px}
.report-card .cnt{font-size:11px;color:var(--text-dim);margin-top:2px}

/* Modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;
  display:flex;align-items:flex-end;justify-content:center;
}
.modal{
  width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--border);
  border-radius:20px 20px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);
  animation:sheet-up .25s var(--ease);
  max-height:88vh;overflow-y:auto;
}
@keyframes sheet-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-size:16px;font-weight:800;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{font-size:12px;color:var(--text-dim);display:block;margin-bottom:6px}
.field input{
  width:100%;padding:11px 12px;border-radius:var(--r-sm);
  background:var(--surface);border:1px solid var(--border);color:var(--text);outline:none;
}
.field input:focus{border-color:var(--border2)}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions button{flex:1;padding:12px;border-radius:var(--r-sm);font-weight:700;font-size:14px}
.cancel{background:var(--surface);color:var(--text-dim);border:1px solid var(--border);padding:12px;border-radius:var(--r-sm);font-weight:700;font-size:14px}
.confirm{background:linear-gradient(145deg,var(--amber-400),var(--amber-500));color:#241608;padding:12px;border-radius:var(--r-sm);font-weight:700;font-size:14px}
.confirm:disabled{opacity:.5}

footer{text-align:center;padding:20px 0 4px;font-size:11px;color:var(--text-dim)}
.install-btn{
  display:block;margin:12px auto 0;padding:9px 18px;border-radius:var(--r-sm);
  background:var(--surface);border:1px solid var(--border);color:var(--amber-300);
  font-size:12.5px;font-weight:600;
}
</style>
</head>
<body>

<!-- ================= LOCK ================= -->
<div id="lock">
  <div class="lock-card">
    <h1>Çayxana · Giriş</h1>
    <form id="lockForm" autocomplete="off">
      <input id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="PIN" autocomplete="off">
      <button type="submit">Daxil ol</button>
      <div id="lockMsg"></div>
    </form>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <header class="top">
    <div class="top-row">
      <div class="brand"><span class="cup">🍵</span><h1>Çayxana</h1></div>
      <div class="nav-btns">
        <button class="nav-btn" data-nav="home">Stollar</button>
        <button class="nav-btn" data-nav="hesabat">Hesabat</button>
        <button class="nav-btn" data-nav="xercler">Xərclər</button>
        <button class="nav-btn" data-nav="mehsullar">Məhsullar</button>
      </div>
    </div>
    <div class="sales-banner">
      <span class="lbl">Bugünkü satış</span>
      <span class="val" id="todaySales">0 ₼</span>
    </div>
  </header>

  <!-- ---- HOME / SATIŞ ---- -->
  <section class="view" id="view-home">
    <div class="tables-grid" id="tablesGrid"></div>
  </section>

  <!-- ---- MASA / SİFARİŞ ---- -->
  <section class="view" id="view-masa">
    <div class="masa-head">
      <button class="back-btn" id="btnBackHome">←</button>
      <h2 id="masaTitle">Masa</h2>
    </div>

    <div class="products-grid" id="productsGrid"></div>

    <div class="order-list" id="orderList"></div>

    <div class="masa-total">
      <span class="lbl">Cəmi</span>
      <span class="val" id="masaTotal">0 ₼</span>
    </div>
    <button class="pay-btn" id="btnPay" disabled>Ödənildi</button>
  </section>

  <!-- ---- HESABAT ---- -->
  <section class="view" id="view-hesabat">
    <div class="period-tabs">
      <button data-period="day" class="active">Bu gün</button>
      <button data-period="week">Bu həftə</button>
      <button data-period="month">Bu ay</button>
      <button data-period="all">Ümumi</button>
    </div>
    <div class="summary-row">
      <div class="stat-card income">
        <div class="val" id="periodIncome">0 ₼</div>
        <div class="lbl">Satış</div>
      </div>
      <div class="stat-card expense">
        <div class="val" id="periodExpense">0 ₼</div>
        <div class="lbl">Xərc</div>
      </div>
      <div class="stat-card net" id="periodNetCard">
        <div class="val" id="periodNet">0 ₼</div>
        <div class="lbl">Faktiki gəlir</div>
      </div>
    </div>
    <div class="report-grid" id="reportGrid"></div>
  </section>

  <!-- ---- XƏRCLƏR ---- -->
  <section class="view" id="view-xercler">
    <div class="expense-banner">
      <span class="lbl">Ümumi xərc (bütün dövr)</span>
      <span class="val" id="totalExpenses">0 ₼</span>
    </div>
    <div class="section-actions">
      <button class="ghost-btn" id="btnAddExpense">+ Xərc əlavə et</button>
    </div>
    <div class="expense-list" id="expenseList"></div>
  </section>

  <!-- ---- MƏHSULLAR ---- -->
  <section class="view" id="view-mehsullar">
    <div class="section-actions">
      <button class="ghost-btn" id="btnAddProductPage">+ Məhsul əlavə et</button>
    </div>
    <div class="expense-list" id="productsList"></div>
  </section>

  <footer>
    Çayxana idarəetmə paneli
    <button id="installBtn" class="install-btn hidden">⬇️ Telefona yüklə</button>
  </footer>
</div>

<!-- ================= MODALS (JS ilə göstərilir) ================= -->
<div id="modalRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase, ref, onValue, get, set, update, remove, push, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ============================================================
   FIREBASE
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyB0RQZ5TjfmrY-amOc-BJUTyiHrnI5Y05s",
  authDomain: "cayxana.firebaseapp.com",
  databaseURL: "https://cayxana-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "cayxana",
  storageBucket: "cayxana.firebasestorage.app",
  messagingSenderId: "907168802351",
  appId: "1:907168802351:web:68bd2115f96eddc7fdc8da"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

/* ============================================================
   PIN GİRİŞİ
   ============================================================ */
(function(){
  const PIN_HASH = '158a323a7ba44870f23d96f1516dd70aa48e9a72db4ebb026b0a89e212a208ab'; // "2026"
  const lockEl = document.getElementById('lock');
  const appEl = document.getElementById('app');
  const form = document.getElementById('lockForm');
  const input = document.getElementById('pinInput');
  const msg = document.getElementById('lockMsg');

  async function sha256(text){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  setTimeout(()=>input.focus(), 250);

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const hash = await sha256(input.value.trim());
    if(hash === PIN_HASH){
      lockEl.style.display = 'none';
      appEl.style.display = 'block';
      initApp();
    } else {
      msg.textContent = 'PIN yanlışdır.';
      input.value = '';
      input.focus();
    }
  });
})();

/* ============================================================
   DATA LAYER (Firebase Realtime Database)
   — Hər iki cihaz (sahib + administrator) eyni datanı real-vaxtda görür.
   Sxem:
     /tables:   { "t_1": { no: 1 }, ... }
     /products: { "p_cay": { name, price }, ... }
     /orders:   { "t_1": { items:{ "<productKey>": {name,price,qty} }, startedAt } }  — yalnız dolu masalar
     /sales:    { "-Nx...": { tableKey, tableNo, items, total, paidAt } }
     /expenses: { "-Nx...": { name, amount, date } }
   ============================================================ */
const rootRef = ref(db, '/');

function defaultData(){
  const tables = {};
  for(let i=1;i<=10;i++) tables['t_'+i] = { no: i };
  return {
    tables,
    products: { p_cay: { name: 'Çay', price: 4 } },
    orders: {},
    sales: {},
    expenses: {}
  };
}

let DB = null;
let currentTableKey = null;
let currentPeriod = 'day';
let appReady = false;

async function ensureSeeded(){
  try{
    const snap = await get(rootRef);
    if(!snap.exists()){
      await set(rootRef, defaultData());
    }
  }catch(err){ reportError(err); }
}

function attachRealtimeListener(){
  onValue(rootRef, (snap)=>{
    const val = snap.val() || {};
    DB = {
      tables: val.tables || {},
      products: val.products || {},
      orders: val.orders || {},
      sales: val.sales || {},
      expenses: val.expenses || {}
    };
    if(!appReady){ appReady = true; renderHome(); }
    else { rerenderActive(); }
  });
}

function rerenderActive(){
  updateSalesBanner();
  const active = document.querySelector('.view.active');
  if(!active) return;
  if(active.id === 'view-home') renderHome();
  if(active.id === 'view-masa' && currentTableKey) renderMasa();
  if(active.id === 'view-hesabat') renderHesabat();
  if(active.id === 'view-xercler') renderXercler();
  if(active.id === 'view-mehsullar') renderMehsullar();
}

/* ============================================================
   APP INIT
   ============================================================ */
async function initApp(){
  bindNav();
  bindMasa();
  bindHesabat();
  bindXercler();
  bindMehsullar();
  await ensureSeeded();
  attachRealtimeListener();
}

// PWA quraşdırma hadisəsi (beforeinstallprompt) səhifə açılan kimi, hələ
// PIN ekranındaykən gələ bilər — ona görə bunu initApp()-un içində yox,
// scriptin ilk işə düşməsi anında qeydə alırıq, əks halda hadisə itir.
setupPwa();

function setupPwa(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  let deferredPrompt = null;
  const installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.remove('hidden');
  });
  installBtn.addEventListener('click', async ()=>{
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.classList.add('hidden');
  });
  window.addEventListener('appinstalled', ()=> installBtn.classList.add('hidden'));
}

function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.nav === name);
  });
}

function bindNav(){
  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const target = btn.dataset.nav;
      if(target === 'hesabat') renderHesabat();
      if(target === 'home') renderHome();
      if(target === 'xercler') renderXercler();
      if(target === 'mehsullar') renderMehsullar();
      switchView(target);
    });
  });
}

// Modal daxilindəki input fokuslananda (klaviatura açılanda) aşağıdakı
// düymələr ekrandan kənarda qalmasın deyə modalı həmin sahəyə sürüşdür.
document.getElementById('modalRoot').addEventListener('focusin', (e)=>{
  if(e.target.tagName === 'INPUT'){
    setTimeout(()=> e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }), 300);
  }
});

/* ============================================================
   FORMAT HELPERS
   ============================================================ */
function reportError(err){
  console.error(err);
  alert('Xəta baş verdi: ' + (err && err.message ? err.message : String(err)));
}

function money(n){
  return (Math.round(n*100)/100).toString().replace(/\.0$/,'') + ' ₼';
}
function orderTotal(order){
  if(!order || !order.items) return 0;
  return Object.values(order.items).reduce((s,it)=>s+it.price*it.qty, 0);
}
function isSameDay(ts, ref){
  const a = new Date(ts), b = new Date(ref);
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function startOfWeek(ref){
  const d = new Date(ref);
  const day = (d.getDay()+6)%7; // Bazar ertəsi = 0
  d.setHours(0,0,0,0);
  d.setDate(d.getDate()-day);
  return d.getTime();
}
function startOfMonth(ref){
  const d = new Date(ref);
  return new Date(d.getFullYear(), d.getMonth(), 1).getTime();
}
function salesArray(){
  return Object.entries(DB.sales).map(([key,v])=>({ key, ...v }));
}
function expensesArray(){
  return Object.entries(DB.expenses).map(([key,v])=>({ key, ...v }));
}
function salesInPeriod(period){
  const now = Date.now();
  return salesArray().filter(s=>{
    if(period==='day') return isSameDay(s.paidAt, now);
    if(period==='week') return s.paidAt >= startOfWeek(now);
    if(period==='month') return s.paidAt >= startOfMonth(now);
    return true; // 'all'
  });
}
function expensesInPeriod(period){
  const now = Date.now();
  return expensesArray().filter(e=>{
    if(period==='day') return isSameDay(e.date, now);
    if(period==='week') return e.date >= startOfWeek(now);
    if(period==='month') return e.date >= startOfMonth(now);
    return true; // 'all'
  });
}

function updateSalesBanner(){
  const todayTotal = salesInPeriod('day').reduce((s,r)=>s+r.total,0);
  document.getElementById('todaySales').textContent = money(todayTotal);
}

/* ============================================================
   ANA SƏHİFƏ (SATIŞ) — STOLLAR
   ============================================================ */
function renderHome(){
  updateSalesBanner();

  const grid = document.getElementById('tablesGrid');
  grid.innerHTML = '';
  const tables = Object.entries(DB.tables)
    .map(([key,v])=>({ key, ...v }))
    .sort((a,b)=>a.no-b.no);

  tables.forEach(t=>{
    const order = DB.orders[t.key];
    const dolu = !!(order && order.items && Object.keys(order.items).length > 0);
    const card = document.createElement('button');
    card.className = 'table-card ' + (dolu ? 'dolu' : 'boş');
    card.innerHTML = `
      <span class="no">${t.no}</span>
      <span class="st">${dolu ? 'Dolu' : 'Boş'}</span>
      ${dolu ? `<span class="amt">${money(orderTotal(order))}</span>` : ''}
    `;
    card.addEventListener('click', ()=> openMasa(t.key));
    grid.appendChild(card);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'add-table-btn';
  addBtn.textContent = '+';
  addBtn.title = 'Yeni stol əlavə et';
  addBtn.addEventListener('click', addTable);
  grid.appendChild(addBtn);
}

async function addTable(){
  const nos = Object.values(DB.tables).map(t=>t.no);
  const nextNo = nos.length ? Math.max(...nos) + 1 : 1;
  try{
    await set(ref(db, '/tables/t_' + nextNo), { no: nextNo });
  }catch(err){ reportError(err); }
}

/* ============================================================
   MASA / SİFARİŞ EKRANI
   ============================================================ */
function bindMasa(){
  document.getElementById('btnBackHome').addEventListener('click', ()=>{ renderHome(); switchView('home'); });
  document.getElementById('btnPay').addEventListener('click', markPaid);
}

function openMasa(tableKey){
  currentTableKey = tableKey;
  renderMasa();
  switchView('masa');
}

let lastProductsSignature = null;

function renderMasa(){
  const table = DB.tables[currentTableKey];
  if(!table){ renderHome(); switchView('home'); return; }
  document.getElementById('masaTitle').textContent = 'Masa ' + table.no;
  renderProductsGridIfChanged();
  renderOrderSection();
}

// Məhsul kartları YALNIZ kataloq faktiki dəyişəndə (yeni əlavə/silmə) yenidən qurulur.
// Sifariş dəyişikliklərində (qty artımı və s.) toxunulmur — sürətli ardıcıl
// vurmalarda "kart barmaq altında yenidən qurulub toxunma itir" problemini önləyir.
function renderProductsGridIfChanged(){
  const products = Object.entries(DB.products).map(([key,v])=>({ key, ...v }));
  const signature = JSON.stringify(products);
  if(signature === lastProductsSignature) return;
  lastProductsSignature = signature;

  const pGrid = document.getElementById('productsGrid');
  pGrid.innerHTML = '';
  products.forEach(p=>{
    const b = document.createElement('button');
    b.className = 'product-btn';
    b.innerHTML = `<span class="pn">${p.name}</span><span class="pp">${money(p.price)}</span>`;
    b.addEventListener('click', ()=> addItemToOrder(p));
    pGrid.appendChild(b);
  });
  const addTile = document.createElement('button');
  addTile.className = 'product-btn add-product-tile';
  addTile.innerHTML = '<span class="pn">+ Yeni</span>';
  addTile.addEventListener('click', openAddProductModal);
  pGrid.appendChild(addTile);
}

function renderOrderSection(){
  const order = DB.orders[currentTableKey];
  const items = order && order.items
    ? Object.entries(order.items).map(([key,v])=>({ productKey: key, ...v }))
    : [];
  const list = document.getElementById('orderList');
  list.innerHTML = '';
  if(items.length === 0){
    list.innerHTML = '<div class="empty-note">Hələ sifariş yoxdur — yuxarıdan məhsul seç.</div>';
  } else {
    items.forEach(it=>{
      const row = document.createElement('div');
      row.className = 'order-line';
      row.innerHTML = `
        <div>
          <span class="nm">${it.name}</span><br>
          <span class="sub">${money(it.price)} / ədəd</span>
        </div>
        <div class="qty-ctrl">
          <button data-act="dec">−</button>
          <span>${it.qty}</span>
          <button data-act="inc">+</button>
        </div>
        <div class="line-total">${money(it.price*it.qty)}</div>
      `;
      row.querySelector('[data-act="inc"]').addEventListener('click', ()=> changeQty(it.productKey, 1));
      row.querySelector('[data-act="dec"]').addEventListener('click', ()=> changeQty(it.productKey, -1));
      list.appendChild(row);
    });
  }

  const total = orderTotal(order);
  document.getElementById('masaTotal').textContent = money(total);
  document.getElementById('btnPay').disabled = items.length === 0;
}

async function addItemToOrder(product, qty = 1){
  try{
    const itemRef = ref(db, `/orders/${currentTableKey}/items/${product.key}`);
    await runTransaction(itemRef, (current)=>{
      if(current) return { name: current.name, price: current.price, qty: current.qty + qty };
      return { name: product.name, price: product.price, qty };
    });
    if(!DB.orders[currentTableKey] || !DB.orders[currentTableKey].startedAt){
      await update(ref(db, `/orders/${currentTableKey}`), { startedAt: Date.now() });
    }
  }catch(err){ reportError(err); }
}

async function deleteProduct(key){
  try{
    await remove(ref(db, '/products/' + key));
  }catch(err){ reportError(err); }
}

async function changeQty(productKey, delta){
  try{
    const itemRef = ref(db, `/orders/${currentTableKey}/items/${productKey}`);
    await runTransaction(itemRef, (current)=>{
      if(!current) return current;
      const newQty = current.qty + delta;
      if(newQty <= 0) return null; // node silinir
      return { name: current.name, price: current.price, qty: newQty };
    });
    const itemsSnap = await get(ref(db, `/orders/${currentTableKey}/items`));
    if(!itemsSnap.exists()){
      await remove(ref(db, `/orders/${currentTableKey}`));
    }
  }catch(err){ reportError(err); }
}

async function markPaid(){
  const order = DB.orders[currentTableKey];
  if(!order || !order.items || Object.keys(order.items).length===0) return;
  try{
    const table = DB.tables[currentTableKey];
    const itemsArr = Object.values(order.items);
    const saleRef = push(ref(db, '/sales'));
    await set(saleRef, {
      tableKey: currentTableKey,
      tableNo: table.no,
      items: itemsArr,
      total: orderTotal(order),
      paidAt: Date.now()
    });
    await remove(ref(db, '/orders/' + currentTableKey));
    renderHome();
    switchView('home');
  }catch(err){ reportError(err); }
}

/* ============================================================
   HESABAT
   ============================================================ */
function bindHesabat(){
  document.querySelectorAll('.period-tabs button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentPeriod = btn.dataset.period;
      document.querySelectorAll('.period-tabs button').forEach(b=>b.classList.toggle('active', b===btn));
      renderHesabat();
    });
  });
}

function renderHesabat(){
  const sales = salesInPeriod(currentPeriod);
  const income = sales.reduce((s,r)=>s+r.total,0);
  const expense = expensesInPeriod(currentPeriod).reduce((s,r)=>s+r.amount,0);
  const net = income - expense;

  document.getElementById('periodIncome').textContent = money(income);
  document.getElementById('periodExpense').textContent = money(expense);
  document.getElementById('periodNet').textContent = money(net);
  document.getElementById('periodNetCard').classList.toggle('negative', net < 0);

  const byTable = {};
  sales.forEach(s=>{
    if(!byTable[s.tableNo]) byTable[s.tableNo] = { total:0, count:0 };
    byTable[s.tableNo].total += s.total;
    byTable[s.tableNo].count += 1;
  });

  const grid = document.getElementById('reportGrid');
  grid.innerHTML = '';
  const tableNos = Object.keys(byTable).map(Number).sort((a,b)=>a-b);
  if(tableNos.length === 0){
    grid.innerHTML = '<div class="empty-note">Bu dövrdə satış qeydə alınmayıb.</div>';
    return;
  }
  tableNos.forEach(no=>{
    const r = byTable[no];
    const card = document.createElement('div');
    card.className = 'report-card';
    card.innerHTML = `
      <div class="no">Masa ${no}</div>
      <div class="amt">${money(r.total)}</div>
      <div class="cnt">${r.count} sifariş</div>
    `;
    grid.appendChild(card);
  });
}

/* ============================================================
   XƏRCLƏR
   ============================================================ */
function bindXercler(){
  document.getElementById('btnAddExpense').addEventListener('click', openAddExpenseModal);
}

function renderXercler(){
  const expenses = expensesArray();
  const total = expenses.reduce((s,e)=>s+e.amount,0);
  document.getElementById('totalExpenses').textContent = money(total);

  const list = document.getElementById('expenseList');
  list.innerHTML = '';
  if(expenses.length === 0){
    list.innerHTML = '<div class="empty-note">Hələ xərc qeydə alınmayıb.</div>';
    return;
  }
  const sorted = expenses.sort((a,b)=>b.date-a.date);
  sorted.forEach(e=>{
    const row = document.createElement('div');
    row.className = 'expense-row';
    const dateStr = new Date(e.date).toLocaleDateString('az-AZ', { day:'2-digit', month:'2-digit', year:'numeric' });
    row.innerHTML = `
      <div>
        <div class="nm">${e.name}</div>
        <div class="dt">${dateStr}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="amt">${money(e.amount)}</span>
        <button class="del" data-key="${e.key}" title="Sil">×</button>
      </div>
    `;
    row.querySelector('.del').addEventListener('click', ()=> deleteExpense(e.key));
    list.appendChild(row);
  });
}

async function deleteExpense(key){
  try{
    await remove(ref(db, '/expenses/' + key));
  }catch(err){ reportError(err); }
}

/* ============================================================
   MƏHSULLAR (kataloq idarəetməsi — əlavə/silmə yalnız burda)
   ============================================================ */
function bindMehsullar(){
  document.getElementById('btnAddProductPage').addEventListener('click', openAddProductModal);
}

function renderMehsullar(){
  const products = Object.entries(DB.products).map(([key,v])=>({ key, ...v }));
  const list = document.getElementById('productsList');
  list.innerHTML = '';
  if(products.length === 0){
    list.innerHTML = '<div class="empty-note">Hələ məhsul əlavə edilməyib.</div>';
    return;
  }
  products.forEach(p=>{
    const row = document.createElement('div');
    row.className = 'expense-row';
    row.innerHTML = `
      <div>
        <div class="nm">${p.name}</div>
        <div class="dt">${money(p.price)}</div>
      </div>
      <button class="del" data-key="${p.key}" title="Sil">×</button>
    `;
    row.querySelector('.del').addEventListener('click', ()=> deleteProduct(p.key));
    list.appendChild(row);
  });
}

function openAddExpenseModal(){
  const root = document.getElementById('modalRoot');
  const todayStr = new Date().toISOString().slice(0,10);
  root.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal">
        <h3>Yeni xərc</h3>
        <div class="field">
          <label>Ad</label>
          <input id="newExpenseName" type="text" placeholder="Məs: Quru çay, qənd, əməkhaqqı">
        </div>
        <div class="field">
          <label>Məbləğ (₼)</label>
          <input id="newExpenseAmount" type="number" step="0.01" min="0" placeholder="Məs: 50">
        </div>
        <div class="field">
          <label>Tarix</label>
          <input id="newExpenseDate" type="date" value="${todayStr}">
        </div>
        <div class="modal-actions">
          <button class="cancel" id="modalCancel">Ləğv et</button>
          <button class="confirm" id="modalConfirm">Əlavə et</button>
        </div>
      </div>
    </div>
  `;
  const close = ()=> root.innerHTML = '';
  document.getElementById('modalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='modalBackdrop') close(); });
  document.getElementById('modalCancel').addEventListener('click', close);
  document.getElementById('modalConfirm').addEventListener('click', async ()=>{
    const name = document.getElementById('newExpenseName').value.trim();
    const amount = parseFloat(document.getElementById('newExpenseAmount').value);
    const dateVal = document.getElementById('newExpenseDate').value;
    if(!name || isNaN(amount) || amount < 0 || !dateVal) return;
    const date = new Date(dateVal + 'T12:00:00').getTime();
    try{
      await push(ref(db, '/expenses'), { name, amount, date });
      close();
    }catch(err){ reportError(err); }
  });
  setTimeout(()=>document.getElementById('newExpenseName').focus(), 50);
}

/* ============================================================
   MODAL — Yeni məhsul(lar) (toplu əlavə)
   Bir neçə məhsulu (ad+qiymət+say) siyahıya yığıb, "Sifarişə
   əlavə et" ilə hamısını bir dəfəyə həm daimi kataloqa, həm də
   cari sifarişə yazır.
   ============================================================ */
function openAddProductModal(){
  const added = []; // bu sessiyada əlavə olunanların qısa siyahısı (yalnız məlumat üçün)
  const root = document.getElementById('modalRoot');

  root.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal">
        <h3>Yeni məhsul</h3>
        <div class="field">
          <label>Ad</label>
          <input id="newProductName" type="text" placeholder="Məs: Coca-Cola">
        </div>
        <div class="field">
          <label>Qiymət (₼)</label>
          <input id="newProductPrice" type="number" step="0.01" min="0" placeholder="Məs: 3.50">
        </div>
        <button type="button" class="confirm" id="addBtn" style="width:100%;margin-bottom:14px">Əlavə et</button>
        <div class="expense-list" id="addedRows"></div>
        <div class="modal-actions">
          <button class="cancel" id="modalClose" style="flex:1">Bağla</button>
        </div>
      </div>
    </div>
  `;
  const close = ()=> root.innerHTML = '';
  const nameInput = document.getElementById('newProductName');
  const priceInput = document.getElementById('newProductPrice');
  const addBtn = document.getElementById('addBtn');
  const rowsEl = document.getElementById('addedRows');

  function renderAdded(){
    if(added.length === 0){ rowsEl.innerHTML = ''; return; }
    rowsEl.innerHTML = added.map(it=>`
      <div class="expense-row">
        <div>
          <div class="nm">✓ ${it.name}</div>
          <div class="dt">${money(it.price)} — məhsul siyahısına əlavə olundu</div>
        </div>
      </div>
    `).join('');
  }

  async function submitProduct(){
    const name = nameInput.value.trim();
    const price = parseFloat(priceInput.value);
    if(!name){ nameInput.focus(); return; }
    if(isNaN(price) || price < 0){ priceInput.focus(); return; }
    addBtn.disabled = true;
    try{
      const productRef = push(ref(db, '/products'));
      await set(productRef, { name, price });
      added.unshift({ name, price });
      renderAdded();
      nameInput.value = '';
      priceInput.value = '';
      nameInput.focus();
    }catch(err){
      reportError(err);
    }finally{
      addBtn.disabled = false;
    }
  }

  addBtn.addEventListener('click', submitProduct);
  nameInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); priceInput.focus(); } });
  priceInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); submitProduct(); } });

  document.getElementById('modalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='modalBackdrop') close(); });
  document.getElementById('modalClose').addEventListener('click', close);
  setTimeout(()=>nameInput.focus(), 50);
}
</script>
